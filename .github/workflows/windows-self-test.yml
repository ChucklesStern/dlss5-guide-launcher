name: Windows self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Batch bootstrap
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Run bootstrap tests
        shell: powershell
        run: .\tests\Test-Bootstrap.ps1

  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Parse launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\DLSS5-Guide-Launcher.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run launcher self-tests
        shell: powershell
        run: .\DLSS5-Guide-Launcher.ps1 -SelfTest
